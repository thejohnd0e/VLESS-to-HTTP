services:
  vless-proxy:
    container_name: vless-to-http
    image: ghcr.io/thejohnd0e/vless-to-http:latest
    build: .
    ports:
      # Published on 127.0.0.1 only by default. To reach the proxy from other machines, set
      # BIND_ADDR=0.0.0.0 (or a LAN address) in .env AND set PROXY_USER/PROXY_PASS.
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-9000}:8080"    # HTTP proxy
      - "${BIND_ADDR:-127.0.0.1}:${SOCKS_PORT:-1080}:1080"   # SOCKS5 proxy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      PROXY_USER: ${PROXY_USER:-}
      PROXY_PASS: ${PROXY_PASS:-}
      PRINT_CONFIG: ${PRINT_CONFIG:-0}
    volumes:
      - ./vless.conf:/app/vless.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
