services:
  vless-proxy:
    container_name: vless-to-http
    # IMAGE_TAG in .env pins a release, e.g. 1.0.0 or 1.0.0-xray26.10.31 (default: latest release)
    image: ghcr.io/thejohnd0e/vless-to-http:${IMAGE_TAG:-latest}
    build: .
    ports:
      # Published on all interfaces (IPv4 and IPv6) by default, so every device in the LAN can use
      # the proxy. Set BIND_ADDR in .env to restrict it (a LAN address, or 127.0.0.1 = this machine only).
      - "${BIND_ADDR:+${BIND_ADDR}:}${HTTP_PORT:-9000}:8080"    # HTTP proxy
      - "${BIND_ADDR:+${BIND_ADDR}:}${SOCKS_PORT:-1080}:1080"   # SOCKS5 proxy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      PROXY_USER: ${PROXY_USER:-}
      PROXY_PASS: ${PROXY_PASS:-}
      PRINT_CONFIG: ${PRINT_CONFIG:-0}
      FAILOVER_STRATEGY: ${FAILOVER_STRATEGY:-leastPing}
      PROBE_URL: ${PROBE_URL:-https://www.gstatic.com/generate_204}
      PROBE_INTERVAL: ${PROBE_INTERVAL:-1m}
      HEALTH_TIMEOUT: ${HEALTH_TIMEOUT:-10}
    volumes:
      - ./vless.conf:/app/vless.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
