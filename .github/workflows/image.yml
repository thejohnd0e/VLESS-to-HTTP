name: image

# Builds a multi-arch image with the current stable Xray-core and publishes it to ghcr.io.
# Runs on code changes, once a day (picks up new Xray releases) and on demand.
on:
  push:
    branches: [master]
    paths: [Dockerfile, entrypoint.sh, .github/workflows/image.yml]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the latest stable Xray-core release
        id: xray
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vless-to-http" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip the scheduled run when this Xray version is already published
        id: skip
        run: |
          if [[ ${{ github.event_name }} == schedule ]] && docker manifest inspect "${{ steps.xray.outputs.image }}:${{ steps.xray.outputs.version }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: XRAY_VERSION=${{ steps.xray.outputs.tag }}
          tags: |
            ${{ steps.xray.outputs.image }}:${{ steps.xray.outputs.version }}
            ${{ steps.xray.outputs.image }}:latest
