name: test

# Static checks and parser tests for entrypoint.sh. Synthetic links only; no tunnel is started.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -s sh entrypoint.sh tests/run.sh

      - name: Parser tests in Alpine (busybox sh/sed, as in the image)
        run: docker run --rm -v "$PWD:/w:ro" -w /w alpine:3.20 sh -c 'apk add -q --no-cache jq && sh tests/run.sh'

      - name: Compose port bindings (default = all interfaces, BIND_ADDR restricts)
        run: |
          set -eu
          touch vless.conf
          ports() { docker compose config --format json | jq -c '[.services."vless-proxy".ports[] | [.host_ip, .published, .target]]'; }
          got=$(ports);                                        echo "default:   $got"
          [ "$got" = '[[null,"9000",8080],[null,"1080",1080]]' ]
          got=$(BIND_ADDR=192.168.0.12 HTTP_PORT=3128 ports);   echo "restricted: $got"
          [ "$got" = '[["192.168.0.12","3128",8080],["192.168.0.12","1080",1080]]' ]

      - name: Build the image
        run: docker build -t vless-to-http:test .

      - name: Validate generated configs with the bundled Xray-core
        run: |
          set -eu
          uuid=11111111-2222-3333-4444-555555555555
          pbk=AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA
          check() {
            printf '%s\n' "$1" > vless.conf
            shift
            # XRAY_BIN=/bin/true: the entrypoint only renders config.json; then Xray validates it.
            docker run --rm -v "$PWD/vless.conf:/app/vless.conf:ro" -e XRAY_BIN=/bin/true "$@" \
              vless-to-http:test sh -c '/app/entrypoint.sh && Xray run -test -config /app/config.json'
          }
          check "vless://$uuid@203.0.113.10:443?security=reality&pbk=$pbk&sni=example.com&sid=abcd&flow=xtls-rprx-vision"
          check "vless://$uuid@203.0.113.10:443?security=reality&pbk=$pbk&sni=example.com&sid=" -e PROXY_USER=alice -e 'PROXY_PASS=p"w\d'
          check "vless://$uuid@203.0.113.10:443?security=reality&type=xhttp&path=%2Fx&mode=auto&pbk=$pbk&sni=example.com&sid=ab" -e LOG_LEVEL=debug
