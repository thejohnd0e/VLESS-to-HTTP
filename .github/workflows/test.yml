name: test

# Static checks, parser tests, config validation with the bundled Xray-core, and an end-to-end
# test against a throwaway local Xray server. Synthetic keys and links only.
# Also called by image.yml, so an image is only published after these pass.
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (default: the triggering commit)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: ShellCheck
        run: shellcheck -s sh entrypoint.sh healthcheck.sh tests/run.sh && shellcheck tests/e2e.sh

      - name: Parser tests in Alpine (busybox sh/sed, as in the image)
        run: docker run --rm -v "$PWD:/w:ro" -w /w alpine:3.23 sh -c 'apk add -q --no-cache jq && sh tests/run.sh'

      - name: Compose port bindings (default = all interfaces, BIND_ADDR restricts)
        run: |
          set -eu
          touch vless.conf
          ports() { docker compose config --format json | jq -c '[.services."vless-proxy".ports[] | [.host_ip, .published, .target]]'; }
          got=$(ports);                                        echo "default:   $got"
          [ "$got" = '[[null,"9000",8080],[null,"1080",1080]]' ]
          got=$(BIND_ADDR=192.168.0.12 HTTP_PORT=3128 ports);   echo "restricted: $got"
          [ "$got" = '[["192.168.0.12","3128",8080],["192.168.0.12","1080",1080]]' ]
          # host network mode override: no published ports, Xray listens on HTTP_PORT/SOCKS_PORT itself
          host=$(COMPOSE_FILE=docker-compose.yml:docker-compose.host.yml HTTP_PORT=3128 docker compose config --format json |
            jq -c '.services."vless-proxy" | [.network_mode, (.ports // []), .environment.LISTEN_ADDR, .environment.HTTP_LISTEN_PORT, .environment.SOCKS_LISTEN_PORT]')
          echo "host mode: $host"
          [ "$host" = '["host",[],"0.0.0.0","3128","1080"]' ]

      - name: Build the image
        run: docker build -t vless-to-http:test .

      - name: Validate generated configs with the bundled Xray-core
        run: |
          set -eu
          uuid=11111111-2222-3333-4444-555555555555
          pbk=AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA
          check() {
            printf '%s\n' "$1" > vless.conf
            shift
            # XRAY_BIN=/bin/true: the entrypoint only renders config.json; then Xray validates it.
            docker run --rm -v "$PWD/vless.conf:/app/vless.conf:ro" -e XRAY_BIN=/bin/true "$@" \
              vless-to-http:test sh -c '/app/entrypoint.sh && Xray run -test -config /tmp/config.json'
          }
          check "vless://$uuid@203.0.113.10:443?security=reality&pbk=$pbk&sni=example.com&sid=abcd&flow=xtls-rprx-vision"
          check "vless://$uuid@203.0.113.10:443?security=reality&pbk=$pbk&sni=example.com&sid=" -e PROXY_USER=alice -e 'PROXY_PASS=p"w\d'
          check "vless://$uuid@203.0.113.10:443?security=reality&type=xhttp&path=%2Fx&mode=auto&pbk=$pbk&sni=example.com&sid=ab" -e LOG_LEVEL=debug
          check "vless://$uuid@[2001:db8::1]:443?security=reality&pbk=$pbk&sni=example.com&sid=ab&type=xhttp&path=/x&extra=%7B%22xmux%22%3A%7B%22maxConcurrency%22%3A%2216-32%22%7D%7D"
          a="vless://$uuid@203.0.113.10:443?security=reality&pbk=$pbk&sni=example.com&sid=ab&flow=xtls-rprx-vision#a"
          b="vless://$uuid@198.51.100.20:443?security=reality&pbk=$pbk&sni=example.com&sid=ab&type=xhttp&path=/x#b"
          nl='
          '
          check "$a$nl$b" -e FAILOVER_STRATEGY=leastPing
          check "$a$nl$b" -e FAILOVER_STRATEGY=roundRobin

      - name: Image runs as non-root and ships the healthcheck
        run: |
          set -eu
          [ "$(docker run --rm --entrypoint id vless-to-http:test -u)" != 0 ]
          [ "$(docker inspect -f '{{json .Config.Healthcheck.Test}}' vless-to-http:test)" = '["CMD","/app/healthcheck.sh"]' ]

      - name: End-to-end (throwaway REALITY server, failover, healthcheck, login)
        run: bash tests/e2e.sh vless-to-http:test
